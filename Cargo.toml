[package]
name = "croisiere"
version = "0.1.0"
edition = "2024"

[dependencies]
croisiere-proc = { path = "crates/croisiere-proc" }

[workspace]
members = ["crates/croisiere-proc", "crates/croisiere-example"]

[workspace.dependencies]
syn = { version = "3.0.10", features = ["full"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"

[dev-dependencies]
trybuild = "1"
