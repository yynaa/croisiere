[package]
name = "croisiere"
version = "0.1.0"
edition = "2024"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
croisiere-proc = { path = "crates/croisiere-proc" }
crossbeam-channel = { workspace = true }
thiserror = { workspace = true }
diesel = { workspace = true, optional = true }
r2d2 = { workspace = true, optional = true }

[workspace]
members = ["crates/croisiere-proc", "crates/croisiere-example"]

[workspace.dependencies]
syn = { version = "3.0.10", features = ["full"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
crossbeam-channel = "0.5.17"
thiserror = "2.0.21"
diesel = { version = "2.4.0" }
r2d2 = "0.8.10"

[dev-dependencies]
trybuild = "1"

[features]
default = ["diesel-sqlite"]
in-memory = []
diesel-sqlite = ["diesel/sqlite", "diesel/r2d2", "dep:r2d2"]
diesel-pg = ["diesel/postgres", "diesel/r2d2", "dep:r2d2"]
